name: Mapping verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and HTTP/UDP integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce reference terrain
        env:
          PYTHONPATH: src
        run: python examples/reproduce.py
      - name: Validate browser code
        run: node --check web/app.js
