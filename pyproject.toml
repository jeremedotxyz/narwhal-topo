[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "narwhal-topo"
version = "0.1.0"
description = "Underwater LiDAR point-cloud mapping, terrain analysis and survey workbench"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
narwhal-topo = "narwhal_topo.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
